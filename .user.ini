; PRINT LAB Trier: PHP limits for the forms (read by PHP-FPM/FastCGI on netcup).
; The quote form allows files up to 15 MB in total, the claim form up to
; 25 MB of photos; anfrage.php attaches them to an e-mail (needs memory).
; Blocked from the web by .htaccess (dot files). Check the active values
; in Plesk: PHP-Einstellungen -> "Die phpinfo() Seite ansehen".
upload_max_filesize = 25M
post_max_size = 32M
memory_limit = 256M
max_input_time = 120
