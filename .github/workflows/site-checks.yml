name: Site checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate HTML
        run: npx --yes html-validate@9 index.html reklamation.html karriere.html zahlung.html bewertungen.html impressum.html datenschutz.html 404.html

      - name: Check JavaScript syntax
        run: for f in js/*.js; do node --check "$f" || exit 1; done

      - name: Check PHP syntax
        run: for f in *.php inc/*.php; do php -l "$f" || exit 1; done

      - name: Check links, assets and anchors
        run: node .github/scripts/check-links.mjs

      - name: Check CSS/JS version stamps
        run: node .github/scripts/stamp-assets.mjs --check
