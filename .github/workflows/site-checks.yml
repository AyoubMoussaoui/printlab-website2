name: Site checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate HTML
        run: npx --yes html-validate@9 index.html impressum.html datenschutz.html 404.html

      - name: Check JavaScript syntax
        run: node --check js/main.js

      - name: Check links, assets and anchors
        run: node .github/scripts/check-links.mjs
